<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drengene Games</title>
<style>
  :root {
    --bg: #14121f;
    --card: #221f33;
    --text: #f3f1ff;
    --muted: #a9a4c7;
    --accent: #ffcc33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  h1 span { color: var(--accent); }
  p.intro { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.game {
    display: block;
    padding: 18px 20px;
    background: var(--card);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    border: 2px solid transparent;
  }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); outline: none; }
  a.game strong { display: block; font-size: 1.15rem; margin-bottom: 4px; }
  a.game small { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>🎮 Drengene <span>Games</span></h1>
  <p class="intro">Små spil på max 2 minutter. Spil, kopiér dit resultat og prøv at slå de andre.</p>

  <ul id="games">
    <!-- SPIL-LISTE: Tilføj nye spil herunder, ét <li> per spil. Eksempel:
    <li><a class="game" href="games/hop-frø/"><strong>🐸 Hop Frø</strong><small>Hop mellem åkanderne uden at falde i vandet.</small></a></li>
    -->
    <li><a class="game" href="games/pizza-party/"><strong>🍕 Pizza Party</strong><small>Spis så meget pizza som muligt i gymnastiksalen på 90 sekunder – men pas på de voksne på sofaen!</small></a></li>
  </ul>
</main>
</body>
</html>
