# Forhåndsvisning af spil i pull requests
#
# Når en PR oprettes eller opdateres, skriver denne action en kommentar på PR'en
# med et link til hvert spil, der er ændret, så man kan prøve det FØR det merges.
# Linkene går via raw.githack.com, som viser filerne direkte fra PR'ens commit.
# Kommentaren opdateres ved hvert nyt push, så der kun er én.
#
# Sikkerhed: "pull_request_target" bruges, så det også virker for PR'er fra forks.
# Actionen henter/kører ALDRIG kode fra PR'en – den læser kun listen over ændrede
# filer via GitHub API og skriver en kommentar.

name: Forhåndsvisning af spil

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const MARKER = "<!-- spil-forhaandsvisning -->";

            // Find de spilmapper (games/<mappenavn>/), som PR'en ændrer
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const games = [...new Set(files
              .filter(f => f.status !== "removed")
              .map(f => f.filename.match(/^games\/([a-z0-9-]+)\//))
              .filter(Boolean)
              .map(m => m[1]))].sort();

            // Find en tidligere kommentar fra denne action
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const old = comments.find(c => c.user.type === "Bot" && c.body.includes(MARKER));

            if (!games.length && !old) return; // PR'en rører ingen spil

            const headRepo = pr.head.repo ? pr.head.repo.full_name : `${owner}/${repo}`;
            const sha = pr.head.sha;
            const base = `https://raw.githack.com/${headRepo}/${sha}`;

            // Læs navn og emoji fra meta.json (hvis den findes)
            async function meta(dir) {
              try {
                const res = await github.rest.repos.getContent({
                  owner: headRepo.split("/")[0], repo: headRepo.split("/")[1],
                  path: `games/${dir}/meta.json`, ref: sha,
                });
                const m = JSON.parse(Buffer.from(res.data.content, "base64").toString("utf8"));
                return `${String(m.emoji || "🎮").slice(0, 8)} ${String(m.navn || dir).slice(0, 60)}`;
              } catch (e) {
                return `🎮 ${dir}`;
              }
            }

            let body = `${MARKER}\n## 🕹️ Prøv spillet før det merges\n\n`;
            if (games.length) {
              for (const g of games) body += `- **${await meta(g)}**: ${base}/games/${g}/index.html\n`;
              body += `\nLinket viser præcis commit \`${sha.slice(0, 7)}\` og opdateres automatisk, når der pushes igen.\n`;
              body += `\n> 🧪 Det er en testversion: scores herfra bliver ikke gemt i den fælles rangliste.\n`;
            } else {
              body += `PR'en ændrer ikke længere nogen spil.\n`;
            }

            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
